[project]
name = "sqlglot-mcp"
version = "0.1.0"
description = "MCP service for SQL lineage analysis powered by sqlglot"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "sqlglot>=26.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sqlglot-mcp = "sqlglot_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]